packages:
  - 'packages/*'

# 共享依赖版本目录（catalog）。
# 规范：优先复用上游 @mcp-b/* 已发布 npm 包（git-source/npm-packages 为只读参考，不作运行时依赖）。
# 版本号对齐 git-source/npm-packages 上游 monorepo，保证与移植代码的 API 形态一致。
catalog:
  '@modelcontextprotocol/client': 2.0.0
  # webmcp-local-relay 依赖（版本锚点对齐 git-source/npm-packages 上游 catalog）
  '@modelcontextprotocol/core': 2.0.0
  '@modelcontextprotocol/server': 2.0.0
  zod: 4.4.3
  '@mcp-b/transports': ^5.1.0
  '@mcp-b/global': ^5.1.0
  '@mcp-b/webmcp-polyfill': ^5.1.0
  '@mcp-b/webmcp-types': ^5.1.0
  # 侧边栏聊天 UI 框架（Vue 3 + TypeScript，运行时编译模板的 esm-bundler 全量构建）
  vue: ^3.5.13
  '@types/node': ^22.20.1
  playwright: ^1.62.1
  typescript: ^5.8.3
  # chrome-extension 构建工具（vite-plus 的 `vp` CLI），与移植代码绑定版本保持一致
  vite-plus: 0.1.24
  # 内置工具 chrome_extension_get_document_info 的 HTML 清洗（Node 生态、无 DOM 依赖，可打进 IIFE）
  sanitize-html: ^2.17.0
  '@types/sanitize-html': ^2.16.0
  eslint: ^9.0.0
  vitest: ^5.0.0
  # vitest 覆盖率插件须与 vitest 主版本一致（上游 4.1.8 对应 vitest 4，本仓库 vitest 5）
  '@vitest/coverage-v8': ^5.0.0

# 允许 pnpm 构建需要原生二进制/后置脚本的依赖（避免交互式确认阻塞 CI）
onlyBuiltDependencies:
  - esbuild
  - playwright
