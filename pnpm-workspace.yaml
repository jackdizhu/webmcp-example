packages:
  - 'packages/*'

# 共享依赖版本目录（catalog）。
# 规范：优先复用上游 @mcp-b/* 已发布 npm 包（git-source/npm-packages 为只读参考，不作运行时依赖）。
# 版本号对齐 git-source/npm-packages 上游 monorepo，保证与移植代码的 API 形态一致。
catalog:
  '@modelcontextprotocol/client': 2.0.0
  '@mcp-b/transports': ^5.1.0
  '@mcp-b/global': ^5.1.0
  '@mcp-b/webmcp-polyfill': ^5.1.0
  '@mcp-b/webmcp-types': ^5.1.0
  '@types/node': ^22.20.1
  playwright: ^1.62.1
  typescript: ^5.8.3
  # chrome-extension 构建工具（vite-plus 的 `vp` CLI），与移植代码绑定版本保持一致
  vite-plus: 0.1.24
  eslint: ^9.0.0
  vitest: ^5.0.0

# 允许 pnpm 构建需要原生二进制/后置脚本的依赖（避免交互式确认阻塞 CI）
onlyBuiltDependencies:
  - esbuild
  - playwright
