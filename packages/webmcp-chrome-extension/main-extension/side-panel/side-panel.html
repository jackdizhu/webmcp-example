<!doctype html>
<html lang="zh-CN" data-page-node-id="6dmoG0XRrfuEKJclyNITYE">
  <head data-page-node-id="lb3QKB1ucM9Ue4AMWuZUHd">
    <meta charset="utf-8" data-page-node-id="ttjI9h4ZTq8jaTEMF4ALvY" />
    <meta name="viewport" content="width=device-width, initial-scale=1" data-page-node-id="erS3PgeDhQbwVC4YpP8NDK" />
    <title>WebMCP 页面工具助手</title>
    <style>
      /* 侧边栏页面样式：仅作用于本页面，不涉及任何宿主页 DOM */
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #app { height: 100%; }
      body {
        font: 13px/1.6 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        color: #1f2328;
        background: #ffffff;
      }
      .panel { display: flex; flex-direction: column; height: 100%; }

      .header {
        display: flex; align-items: center; gap: 8px;
        padding: 10px 12px; border-bottom: 1px solid #e5e7eb;
      }
      .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
      .dot-on { background: #16a34a; }
      .dot-off { background: #9ca3af; }
      .title { font-weight: 500; flex: 1; }
      .tools-count { color: #6b7280; font-size: 12px; }

      /* relay 连接状态栏（摘要行 + 可展开明细） */
      .relay-bar { border-bottom: 1px solid #e5e7eb; background: #f8fafc; }
      .relay-summary {
        display: flex; align-items: center; gap: 8px; width: 100%;
        padding: 6px 12px; border: none; border-radius: 0;
        background: transparent; color: #374151; font-size: 12px;
        cursor: pointer; text-align: left;
      }
      .relay-summary:hover { background: #f1f5f9; }
      .relay-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
      .relay-dot-on { background: #16a34a; }
      .relay-dot-warn { background: #d97706; }
      .relay-dot-off { background: #9ca3af; }
      .relay-summary-text { flex: 1; }
      .relay-caret { color: #9ca3af; font-size: 11px; }
      .relay-list { list-style: none; padding: 0 12px 8px; display: flex; flex-direction: column; gap: 6px; }
      .relay-item {
        border: 1px solid #e5e7eb; border-radius: 6px; background: #ffffff;
        padding: 6px 8px; display: flex; flex-direction: column; gap: 2px;
      }
      .relay-item-head { display: flex; align-items: center; gap: 8px; }
      .relay-item-title {
        flex: 1; font-size: 12px; font-weight: 500; color: #1f2328;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .relay-badge { font-size: 11px; flex: none; }
      .relay-badge-connected { color: #16a34a; }
      .relay-badge-connecting, .relay-badge-reconnecting { color: #d97706; }
      .relay-badge-dormant, .relay-badge-stopped { color: #9ca3af; }
      .relay-item-meta {
        font-size: 11px; color: #6b7280;
        font-family: ui-monospace, Consolas, monospace;
        word-break: break-all;
      }

      .settings { display: flex; flex-direction: column; gap: 8px; padding: 12px; background: #f8fafc; border-bottom: 1px solid #e5e7eb; }
      .settings label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #374151; }
      .settings input {
        padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px;
      }
      .settings .settings-check { flex-direction: row; align-items: center; gap: 6px; }
      .settings .settings-check input { width: 14px; height: 14px; padding: 0; }
      .settings .settings-field { gap: 4px; }
      .settings .settings-field input[type='number'] { width: 96px; padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; }
      .settings-textarea {
        width: 100%; resize: vertical; padding: 6px 8px; border: 1px solid #d1d5db;
        border-radius: 6px; font: 13px/1.6 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      .settings-hint { font-size: 11px; color: #9ca3af; }

      .settings-logs {
        display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
        padding-top: 8px; border-top: 1px solid #e5e7eb;
      }
      .settings-log-count { font-size: 12px; color: #374151; }

      /* 页签横向滚动：空间充足时均分填满（flex-grow），不足时不收缩、容器出横向滚动条 */
      .tabs {
        display: flex; align-items: center; border-bottom: 1px solid #e5e7eb;
        overflow-x: auto; scrollbar-width: thin;
      }
      .tabs button {
        flex: 1 0 auto; padding: 8px 10px; border: none; border-radius: 0; background: transparent;
        color: #6b7280; font-size: 13px; cursor: pointer; border-bottom: 2px solid transparent;
        white-space: nowrap;
      }
      .tabs .tab-active { color: #185fa5; font-weight: 500; border-bottom-color: #185fa5; }
      /* 执行锁：入口禁用 + 右侧终止区 */
      .tabs-locked button { cursor: not-allowed; }
      .tabs-locked button:not(.tabs-abort) { opacity: 0.55; }
      .tabs-lock-area {
        display: flex; align-items: center; gap: 6px; flex: none; padding-right: 8px;
      }
      .tabs-lock-label { font-size: 11px; color: #d97706; white-space: nowrap; }
      .tabs-abort {
        flex: none; background: #a32d2d; color: #ffffff;
        padding: 4px 10px; font-size: 12px; border-radius: 6px;
      }
      .tabs-abort:disabled { opacity: 0.5; }

      /* 对话页容器：包住消息区与输入区，占满剩余空间（v-show 显隐时保留 flex 语义） */
      .chat-page { flex: 1; min-height: 0; display: flex; flex-direction: column; }

      /* 智能体选择器 + 切换确认条（P1）：领域规则在 core，UI 仅呈现 */
      .chat-agents { display: flex; align-items: center; gap: 8px; padding: 8px 12px 0; }
      .chat-agents-label { font-size: 12px; color: #6b7280; flex: none; }
      .chat-agents-select {
        flex: 1; min-width: 0; padding: 4px 8px; border: 1px solid #d1d5db; border-radius: 8px;
        font: inherit; font-size: 12px; background: #ffffff; color: #111827;
      }
      .chat-agents-select:disabled { opacity: 0.5; cursor: not-allowed; }
      .chat-agents-inspect { padding: 4px 10px; font-size: 12px; flex: none; }
      .chat-agent-confirm {
        display: flex; align-items: center; gap: 8px; margin: 8px 12px 0; padding: 8px 10px;
        border: 1px solid #f59e0b; border-radius: 8px; background: #fffbeb; flex-wrap: wrap;
      }
      .chat-agent-confirm-text { flex: 1 1 auto; font-size: 12px; color: #92400e; min-width: 0; }
      .chat-agent-confirm-btn { padding: 4px 10px; font-size: 12px; }
      .chat-agent-confirm-cancel { padding: 4px 10px; font-size: 12px; }

      /* relay 调用页：只读调用日志 */
      .relay-page { flex: 1; min-height: 0; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }

      /* 数据源设置页：数据源选择（复用 .relay-source-* 样式）+ 连接刷新 */
      .datasource-page { flex: 1; min-height: 0; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
      .datasource-connections { display: flex; flex-direction: column; gap: 6px; }
      .datasource-connections h4 { font-size: 13px; color: #1f2328; font-weight: 500; }
      .relay-page-header { display: flex; flex-direction: column; gap: 4px; }
      .relay-page-header h4 { font-size: 13px; color: #1f2328; font-weight: 500; }
      .relay-page-status { font-size: 12px; color: #374151; }
      .relay-page-empty-status { font-size: 12px; color: #9ca3af; }
      .relay-page-running { font-size: 12px; color: #d97706; }
      .relay-page-terminated { font-size: 11px; color: #9ca3af; }
      .relay-page-empty { font-size: 12px; color: #9ca3af; text-align: center; margin-top: 24px; padding: 0 12px; }
      /* relay 数据源选择：checkbox 多选；未选中的页签不连 relay（数据过滤不传递） */
      .relay-source-picker { display: flex; flex-direction: column; gap: 6px; }
      .relay-source-picker h4 { font-size: 13px; color: #1f2328; font-weight: 500; }
      .relay-source-mode { font-size: 11px; color: #6b7280; }
      .relay-source-list { list-style: none; display: flex; flex-direction: column; gap: 4px; }
      .relay-source-item {
        display: flex; align-items: center; gap: 8px; padding: 4px 8px;
        border: 1px solid #e5e7eb; border-radius: 6px; background: #ffffff;
      }
      .relay-source-label { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; cursor: pointer; }
      .relay-source-label input[type='checkbox'] { width: 14px; height: 14px; flex: none; }
      .relay-source-title {
        font-size: 12px; color: #1f2328;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .relay-source-reset { align-self: flex-start; }
      .invoke-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
      .invoke-item {
        border: 1px solid #e5e7eb; border-radius: 8px; background: #ffffff;
        padding: 6px 8px; display: flex; flex-direction: column; gap: 3px;
      }
      .invoke-item-running { border-color: #fcd34d; background: #fffbeb; }
      .invoke-item-head { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
      .invoke-time { font: 11px ui-monospace, Consolas, monospace; color: #9ca3af; flex: none; }
      .invoke-tool { font-size: 12px; font-weight: 500; color: #185fa5; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .invoke-badge { font-size: 11px; flex: none; }
      .invoke-badge-running { color: #d97706; }
      .invoke-badge-ok { color: #16a34a; }
      .invoke-badge-fail { color: #a32d2d; }
      .invoke-elapsed { font-size: 11px; color: #6b7280; flex: none; }
      .invoke-tab { font-size: 11px; color: #9ca3af; flex: none; }
      .invoke-args, .invoke-result {
        font: 11px/1.5 ui-monospace, Consolas, monospace;
        white-space: pre-wrap; word-break: break-all; color: #374151;
        max-height: 100px; overflow-y: auto;
      }
      .invoke-result-failed { color: #a32d2d; }

      /* 设置页容器：占满剩余空间并允许滚动（表单本体复用 SettingsPanel） */
      .settings-page { flex: 1; min-height: 0; overflow-y: auto; }

      .debugger { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
      .debug-form { display: flex; flex-direction: column; gap: 8px; }
      .debug-form label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #374151; }
      .debug-form select, .debug-form textarea {
        padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 6px; font: inherit;
      }
      .debug-form textarea { font: 12px/1.5 ui-monospace, Consolas, monospace; resize: vertical; }
      .debug-desc { font-size: 11px; color: #6b7280; }
      .debug-error { font-size: 12px; color: #a32d2d; }
      .debug-actions { display: flex; gap: 8px; }

      /* 参数说明面板（inputSchema 解析结果，辅助构造合法参数） */
      .debug-params { display: flex; flex-direction: column; gap: 6px; }
      .debug-params h4 { margin: 0; font-size: 12px; color: #374151; }
      .debug-params-empty { margin: 0; font-size: 11px; color: #6b7280; }
      .debug-params-list {
        list-style: none; margin: 0; padding: 0;
        display: flex; flex-direction: column; gap: 6px;
      }
      .debug-param { border: 1px solid #e5e7eb; border-radius: 6px; padding: 6px 8px; background: #f9fafb; }
      .debug-param-head { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
      .debug-param-name { font-size: 12px; font-weight: 600; color: #111827; }
      .debug-param-type { font-size: 11px; color: #7c3aed; }
      .badge-required, .badge-optional {
        font-size: 10px; border-radius: 4px; padding: 0 4px; line-height: 16px;
      }
      .badge-required { color: #a32d2d; background: #fee2e2; }
      .badge-optional { color: #6b7280; background: #eef2f7; }
      .debug-param-default { font-size: 10px; color: #6b7280; }
      .debug-param-desc { margin: 4px 0 0; font-size: 11px; color: #4b5563; }
      .debug-param-enum { margin: 2px 0 0; font-size: 11px; color: #6b7280; }

      .debug-result {
        border: 1px solid #e5e7eb; border-radius: 8px; padding: 8px 10px;
        display: flex; flex-direction: column; gap: 6px;
      }
      .debug-result-failed { border-color: #fecaca; background: #fef2f2; }
      .debug-result header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .badge-ok { font-size: 11px; color: #16a34a; }
      .badge-fail { font-size: 11px; color: #a32d2d; }
      .debug-result-text, .debug-result-json {
        font: 11px/1.5 ui-monospace, Consolas, monospace;
        white-space: pre-wrap; word-break: break-all; max-height: 180px; overflow-y: auto;
      }
      .debug-result summary { font-size: 12px; color: #6b7280; cursor: pointer; }

      .debug-history { display: flex; flex-direction: column; gap: 6px; }
      .debug-history h4 { font-size: 12px; color: #374151; font-weight: 500; }
      .debug-history-item {
        display: flex; align-items: center; gap: 8px; padding: 4px 8px;
        border: 1px solid #e5e7eb; border-radius: 6px; font-size: 12px;
      }
      .debug-history-name { flex: 1; color: #185fa5; font-weight: 500; }
      .debug-history-meta { color: #9ca3af; font-size: 11px; }

      .messages { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
      .empty { color: #9ca3af; text-align: center; margin-top: 32px; display: flex; flex-direction: column; gap: 4px; padding: 0 8px; }
      .busy { color: #6b7280; font-size: 12px; text-align: center; }

      .msg { display: flex; }
      .msg-user { justify-content: flex-end; }
      .msg-assistant { justify-content: flex-start; }
      .bubble {
        max-width: 88%; padding: 8px 10px; border-radius: 10px;
        background: #f1f5f9; display: flex; flex-direction: column; gap: 6px;
      }
      .msg-user .bubble { background: #dbeafe; }
      .content { white-space: pre-wrap; word-break: break-word; }

      .tool { border: 1px solid #e5e7eb; border-radius: 8px; background: #ffffff; padding: 6px 8px; }
      .tool-failed { border-color: #fecaca; background: #fef2f2; }
      .tool-skill { border-color: #a7d9c6; background: #f4fbf8; }
      .tool-head { display: flex; align-items: center; gap: 6px; }
      .tool-badge {
        flex: none; font-size: 10px; font-weight: 500; line-height: 1; padding: 3px 5px;
        border-radius: 4px; background: #e6f1fb; color: #185fa5;
      }
      .tool-badge-skill { background: #e1f5ee; color: #0f6e56; }
      .tool-name { font-size: 12px; font-weight: 500; color: #185fa5; }
      .tool-failed .tool-name { color: #a32d2d; }
      .tool-toggle { margin-left: auto; flex: none; font-size: 11px; color: #9ca3af; user-select: none; }
      .tool-result {
        margin-top: 4px; font: 11px/1.5 ui-monospace, Consolas, monospace;
        white-space: pre-wrap; word-break: break-all; max-height: 140px; overflow-y: auto;
      }

      .composer { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid #e5e7eb; align-items: flex-end; }
      .composer textarea {
        flex: 1; resize: none; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 8px; font: inherit;
      }
      button {
        padding: 8px 14px; border: none; border-radius: 8px; background: #185fa5; color: #ffffff;
        font-size: 13px; cursor: pointer; flex: none;
      }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      .ghost { background: transparent; color: #185fa5; border: 1px solid #d1d5db; padding: 4px 10px; }
    </style>
  </head>
  <body data-page-node-id="cMBYfJ5VCSbfsXi1klUpsU">
    <div id="app" data-page-node-id="bLSrS1ubRoR1khvP9ugcgc"></div>
    <script src="side-panel.iife.js"></script>
  </body>
</html>
