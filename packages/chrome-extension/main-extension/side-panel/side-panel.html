<!doctype html>
<html lang="zh-CN" data-page-node-id="6dmoG0XRrfuEKJclyNITYE">
  <head data-page-node-id="lb3QKB1ucM9Ue4AMWuZUHd">
    <meta charset="utf-8" data-page-node-id="ttjI9h4ZTq8jaTEMF4ALvY" />
    <meta name="viewport" content="width=device-width, initial-scale=1" data-page-node-id="erS3PgeDhQbwVC4YpP8NDK" />
    <title>WebMCP 页面工具助手</title>
    <style>
      /* 侧边栏页面样式：仅作用于本页面，不涉及任何宿主页 DOM */
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #app { height: 100%; }
      body {
        font: 13px/1.6 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        color: #1f2328;
        background: #ffffff;
      }
      .panel { display: flex; flex-direction: column; height: 100%; }

      .header {
        display: flex; align-items: center; gap: 8px;
        padding: 10px 12px; border-bottom: 1px solid #e5e7eb;
      }
      .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
      .dot-on { background: #16a34a; }
      .dot-off { background: #9ca3af; }
      .title { font-weight: 500; flex: 1; }
      .tools-count { color: #6b7280; font-size: 12px; }

      .settings { display: flex; flex-direction: column; gap: 8px; padding: 12px; background: #f8fafc; border-bottom: 1px solid #e5e7eb; }
      .settings label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #374151; }
      .settings input {
        padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px;
      }
      .settings .settings-check { flex-direction: row; align-items: center; gap: 6px; }
      .settings .settings-check input { width: 14px; height: 14px; padding: 0; }
      .settings-hint { font-size: 11px; color: #9ca3af; }

      .settings-logs {
        display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
        padding-top: 8px; border-top: 1px solid #e5e7eb;
      }
      .settings-log-count { font-size: 12px; color: #374151; }

      .tabs { display: flex; border-bottom: 1px solid #e5e7eb; }
      .tabs button {
        flex: 1; padding: 8px 0; border: none; border-radius: 0; background: transparent;
        color: #6b7280; font-size: 13px; cursor: pointer; border-bottom: 2px solid transparent;
      }
      .tabs .tab-active { color: #185fa5; font-weight: 500; border-bottom-color: #185fa5; }

      /* 对话页容器：包住消息区与输入区，占满剩余空间（v-show 显隐时保留 flex 语义） */
      .chat-page { flex: 1; min-height: 0; display: flex; flex-direction: column; }

      .debugger { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
      .debug-form { display: flex; flex-direction: column; gap: 8px; }
      .debug-form label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #374151; }
      .debug-form select, .debug-form textarea {
        padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 6px; font: inherit;
      }
      .debug-form textarea { font: 12px/1.5 ui-monospace, Consolas, monospace; resize: vertical; }
      .debug-desc { font-size: 11px; color: #6b7280; }
      .debug-error { font-size: 12px; color: #a32d2d; }
      .debug-actions { display: flex; gap: 8px; }

      .debug-result {
        border: 1px solid #e5e7eb; border-radius: 8px; padding: 8px 10px;
        display: flex; flex-direction: column; gap: 6px;
      }
      .debug-result-failed { border-color: #fecaca; background: #fef2f2; }
      .debug-result header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .badge-ok { font-size: 11px; color: #16a34a; }
      .badge-fail { font-size: 11px; color: #a32d2d; }
      .debug-result-text, .debug-result-json {
        font: 11px/1.5 ui-monospace, Consolas, monospace;
        white-space: pre-wrap; word-break: break-all; max-height: 180px; overflow-y: auto;
      }
      .debug-result summary { font-size: 12px; color: #6b7280; cursor: pointer; }

      .debug-history { display: flex; flex-direction: column; gap: 6px; }
      .debug-history h4 { font-size: 12px; color: #374151; font-weight: 500; }
      .debug-history-item {
        display: flex; align-items: center; gap: 8px; padding: 4px 8px;
        border: 1px solid #e5e7eb; border-radius: 6px; font-size: 12px;
      }
      .debug-history-name { flex: 1; color: #185fa5; font-weight: 500; }
      .debug-history-meta { color: #9ca3af; font-size: 11px; }

      .messages { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
      .empty { color: #9ca3af; text-align: center; margin-top: 32px; }
      .busy { color: #6b7280; font-size: 12px; text-align: center; }

      .msg { display: flex; }
      .msg-user { justify-content: flex-end; }
      .msg-assistant { justify-content: flex-start; }
      .bubble {
        max-width: 88%; padding: 8px 10px; border-radius: 10px;
        background: #f1f5f9; display: flex; flex-direction: column; gap: 6px;
      }
      .msg-user .bubble { background: #dbeafe; }
      .content { white-space: pre-wrap; word-break: break-word; }

      .tool { border: 1px solid #e5e7eb; border-radius: 8px; background: #ffffff; padding: 6px 8px; }
      .tool-failed { border-color: #fecaca; background: #fef2f2; }
      .tool-name { font-size: 12px; font-weight: 500; color: #185fa5; }
      .tool-failed .tool-name { color: #a32d2d; }
      .tool-result {
        margin-top: 4px; font: 11px/1.5 ui-monospace, Consolas, monospace;
        white-space: pre-wrap; word-break: break-all; max-height: 140px; overflow-y: auto;
      }

      .composer { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid #e5e7eb; align-items: flex-end; }
      .composer textarea {
        flex: 1; resize: none; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 8px; font: inherit;
      }
      button {
        padding: 8px 14px; border: none; border-radius: 8px; background: #185fa5; color: #ffffff;
        font-size: 13px; cursor: pointer; flex: none;
      }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      .ghost { background: transparent; color: #185fa5; border: 1px solid #d1d5db; padding: 4px 10px; }
    </style>
  </head>
  <body data-page-node-id="cMBYfJ5VCSbfsXi1klUpsU">
    <div id="app" data-page-node-id="bLSrS1ubRoR1khvP9ugcgc"></div>
    <script src="side-panel.iife.js"></script>
  </body>
</html>
