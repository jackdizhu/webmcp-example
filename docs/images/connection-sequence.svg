<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" width="680" role="img">
  <title>WebMCP 扩展与页面连接建立时序</title>
  <desc>六个步骤：注入运行时、页面注册工具、探测就绪、握手会话、开启桥接、侧栏接入调用</desc>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <line x1="70" y1="68" x2="70" y2="378" stroke="#B4B2A9" stroke-width="1.5"/>
  <circle cx="70" cy="68" r="16" fill="#185FA5"/>
  <text x="70" y="69" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#FFFFFF" font-family="sans-serif">1</text>
  <rect x="110" y="40" width="510" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="130" y="62" font-size="13" font-weight="500" fill="#0C447C" font-family="sans-serif">注入 WebMCP 运行时</text>
  <text x="130" y="83" font-size="12" fill="#185FA5" font-family="sans-serif">document_start 注入 main-world.ts → 安装 document.modelContext</text>
  <circle cx="70" cy="130" r="16" fill="#0F6E56"/>
  <text x="70" y="131" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#FFFFFF" font-family="sans-serif">2</text>
  <rect x="110" y="102" width="510" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="130" y="124" font-size="13" font-weight="500" fill="#085041" font-family="sans-serif">页面注册工具</text>
  <text x="130" y="145" font-size="12" fill="#0F6E56" font-family="sans-serif">modelContext.registerTool(get_status)，execute 在页面主世界内执行</text>
  <circle cx="70" cy="192" r="16" fill="#185FA5"/>
  <text x="70" y="193" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#FFFFFF" font-family="sans-serif">3</text>
  <rect x="110" y="164" width="510" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="130" y="186" font-size="13" font-weight="500" fill="#0C447C" font-family="sans-serif">扩展侧发起探测</text>
  <text x="130" y="207" font-size="12" fill="#185FA5" font-family="sans-serif">TabClientTransport 经 window.postMessage 发送 mcp-check-ready</text>
  <circle cx="70" cy="254" r="16" fill="#BA7517"/>
  <text x="70" y="255" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#FFFFFF" font-family="sans-serif">4</text>
  <rect x="110" y="226" width="510" height="56" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
  <text x="130" y="248" font-size="13" font-weight="500" fill="#633806" font-family="sans-serif">握手建立 MCP 会话</text>
  <text x="130" y="269" font-size="12" fill="#854F0B" font-family="sans-serif">polyfill 应答 mcp-server-ready → JSON-RPC initialize（5×10s 重试兜底）</text>
  <circle cx="70" cy="316" r="16" fill="#185FA5"/>
  <text x="70" y="317" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#FFFFFF" font-family="sans-serif">5</text>
  <rect x="110" y="288" width="510" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="130" y="310" font-size="13" font-weight="500" fill="#0C447C" font-family="sans-serif">扩展内开启桥接</text>
  <text x="130" y="331" font-size="12" fill="#185FA5" font-family="sans-serif">握手成功即注册 startPageToolsBridge，监听 runtime.onConnect</text>
  <circle cx="70" cy="378" r="16" fill="#185FA5"/>
  <text x="70" y="379" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#FFFFFF" font-family="sans-serif">6</text>
  <rect x="110" y="350" width="510" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="130" y="372" font-size="13" font-weight="500" fill="#0C447C" font-family="sans-serif">侧栏接入并调用工具</text>
  <text x="130" y="393" font-size="12" fill="#185FA5" font-family="sans-serif">chrome.runtime.connect → listTools/callTool 代理到页面，结果按 id 原路返回</text>
</svg>
